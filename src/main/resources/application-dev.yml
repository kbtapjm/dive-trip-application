spring:
  config:
    activate:
      on-profile: dev
  application:
    name: dive-trip-application
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/dive_trip?rewriteBatchedStatements=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: master
    password: 1234
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        highlight_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    producer:
      bootstrap-servers: localhost:9092 # Kafka 클러스터에 대한 초기 연결에 사용할 호스트 : 포트 목록
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
      remote:
        restart:
          enabled: false
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 20260202
    locations:
      - classpath:db/migration
      - classpath:db/seed

spring-doc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    doc-expansion: list
  api-docs:
    path: /api-docs
    resolveSchemaProperties: true

logging:
  level:
    root: info
    io:
      divetrip: debug
    org:
      springframework: info
      hibernate:
        sql: debug
        orm:
          jdbc:
            bind: trace

props:
  jwt:
    header: Authorization
    #HS512 알고리즘을 사용할 것이기 때문에 512bit, 즉 64byte 이상의 secret key를 사용해야 한다.
    secret: a2FyaW10b2thcmltdG9rYXJpbXRva2FyaW10b2thcmltdG9rYXJpbXRva2FyaW10b2thcmltdG9rYXJpbXRva2FyaW10b2thcmltdG9rYXJpbXRva2FyaW10b2thcmltdG9rYXJpbXRva2FyaW10b2thcmltdG9rYXJpbXRva2FyaW10b2thcmltdG9rYXJpbQ==
    token:
      access-expiration-time: 1800000 #ttl(초): 1000 * 60 * 30 (30분)
      refresh-expiration-time: 86400000 #ttl(초): 1000 * 60 * 60 * 24 * 1 (일)

